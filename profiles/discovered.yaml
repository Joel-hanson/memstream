application: discovered-app
source_database: defaultdb
changefeed:
  tables:
    - orders
    - stock
    - tickets
    - users
  sink: s3
rules:
  - name: orders_status_change
    table: orders
    when:
      columns_changed:
        - status
    chunk_template: Table orders row {{ id }} field status changed {{before.status}}
      → {{after.status}} at {{timestamp}}.
    tags:
      - orders
      - status
  - name: orders_quantity_change
    table: orders
    when:
      columns_changed:
        - quantity
    chunk_template: Table orders row {{ id }} field quantity changed
      {{before.quantity}} → {{after.quantity}} at {{timestamp}}.
    tags:
      - orders
      - quantity
  - name: stock_quantity_change
    table: stock
    when:
      columns_changed:
        - quantity
    chunk_template: Table stock row {{ sku }} field quantity changed
      {{before.quantity}} → {{after.quantity}} at {{timestamp}}.
    tags:
      - stock
      - quantity
  - name: tickets_status_change
    table: tickets
    when:
      columns_changed:
        - status
    chunk_template: Table tickets row {{ id }} field status changed
      {{before.status}} → {{after.status}} at {{timestamp}}.
    tags:
      - tickets
      - status
  - name: users_role_change
    table: users
    when:
      columns_changed:
        - role
    chunk_template: Table users row {{ id }} field role changed {{before.role}} →
      {{after.role}} at {{timestamp}}.
    tags:
      - users
      - role
embedding:
  model: amazon.titan-embed-text-v2:0
  table: agent_memory_chunks
  dimensions: 1024
discovery:
  enabled: true
  mode: schema_propose
insights:
  enabled: false
  schedule: manual
