<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Memstream architecture</title>
  <desc id="desc">How Cursor agents, Memstream, CockroachDB, and AWS turn application writes into searchable agent memory.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="820" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="180" fill="#14b8a6" opacity="0.06"/>
  <circle cx="1100" cy="680" r="220" fill="#38bdf8" opacity="0.05"/>

  <text x="64" y="58" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Memstream</text>
  <text x="64" y="88" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#94a3b8">Agent memory from CockroachDB changefeeds on AWS</text>
  <rect x="64" y="104" width="120" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">
    <rect x="900" y="42" width="12" height="12" rx="2" fill="#14b8a6"/>
    <text x="920" y="53">Write / CDC path</text>
    <rect x="1055" y="42" width="12" height="12" rx="2" fill="#38bdf8"/>
    <text x="1075" y="53">Ask / retrieve path</text>
  </g>

  <!-- Applications -->
  <g filter="url(#soft)">
    <rect x="48" y="160" width="280" height="280" rx="16" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="72" y="196" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2dd4bf" letter-spacing="0.08em">APPLICATIONS</text>
  <text x="72" y="224" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Acme Shop + apps</text>
  <text x="72" y="252" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">Orders, stock, tickets, case notes</text>

  <rect x="72" y="278" width="232" height="48" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="92" y="307" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#e2e8f0">Write transactional data</text>

  <rect x="72" y="340" width="232" height="72" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="92" y="368" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Support / staff agents</text>
  <text x="92" y="390" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">Ask via Cursor + MCP</text>

  <!-- Memstream control plane -->
  <g filter="url(#soft)">
    <rect x="380" y="160" width="320" height="200" rx="16" fill="url(#panel)" stroke="#14b8a6" stroke-width="1.5"/>
  </g>
  <text x="404" y="196" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2dd4bf" letter-spacing="0.08em">MEMSTREAM CONTROL PLANE</text>
  <text x="404" y="224" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Console / APIs / MCP</text>
  <text x="404" y="248" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">Connect - Configure - Enable - Live</text>

  <rect x="404" y="272" width="130" height="56" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="420" y="296" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Platform DB</text>
  <text x="420" y="314" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">runs / profiles</text>

  <rect x="546" y="272" width="130" height="56" rx="10" fill="#0b1220" stroke="#475569"/>
  <text x="562" y="296" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Memstream MCP</text>
  <text x="562" y="314" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">search_memory</text>

  <!-- CockroachDB -->
  <g filter="url(#soft)">
    <rect x="760" y="160" width="472" height="280" rx="16" fill="url(#panel)" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <text x="784" y="196" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc" letter-spacing="0.08em">COCKROACHDB CLOUD</text>
  <text x="784" y="224" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Customer application database</text>
  <text x="784" y="248" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">Memory stays with the database of record</text>

  <rect x="784" y="272" width="200" height="128" rx="12" fill="#0b1220" stroke="#475569"/>
  <text x="804" y="304" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">App tables</text>
  <text x="804" y="328" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">orders / stock</text>
  <text x="804" y="348" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">tickets / case_notes</text>
  <text x="804" y="376" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">unchanged by Memstream</text>

  <rect x="1008" y="272" width="200" height="128" rx="12" fill="#0b1220" stroke="#38bdf8"/>
  <text x="1028" y="304" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#7dd3fc">agent_memory_chunks</text>
  <text x="1028" y="328" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">VECTOR index</text>
  <text x="1028" y="348" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">Distributed vector search</text>
  <text x="1028" y="376" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">searchable agent memory</text>

  <!-- AWS -->
  <g filter="url(#soft)">
    <rect x="48" y="500" width="1184" height="250" rx="16" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="72" y="540" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fbbf24" letter-spacing="0.08em">AWS DATA PLANE</text>
  <text x="72" y="568" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Changefeed - embed - write memory</text>

  <rect x="72" y="600" width="250" height="110" rx="12" fill="#0b1220" stroke="#f59e0b"/>
  <text x="92" y="636" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fbbf24">Amazon S3</text>
  <text x="92" y="660" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">Changefeed sink</text>
  <text x="92" y="682" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">CDC events from watched tables</text>

  <rect x="370" y="600" width="250" height="110" rx="12" fill="#0b1220" stroke="#f59e0b"/>
  <text x="390" y="636" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fbbf24">Worker</text>
  <text x="390" y="660" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">EC2 / Lambda / laptop</text>
  <text x="390" y="682" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Profile rules to chunk text</text>

  <rect x="668" y="600" width="250" height="110" rx="12" fill="#0b1220" stroke="#f59e0b"/>
  <text x="688" y="636" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fbbf24">Amazon Bedrock</text>
  <text x="688" y="660" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">Embeddings</text>
  <text x="688" y="682" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Vectors for agent memory</text>

  <rect x="966" y="600" width="242" height="110" rx="12" fill="#0b1220" stroke="#38bdf8"/>
  <text x="986" y="636" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7dd3fc">Write back to CRDB</text>
  <text x="986" y="660" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">agent_memory_chunks</text>
  <text x="986" y="682" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">+ VECTOR index</text>

  <!-- Write path -->
  <path d="M 328 300 C 420 300, 520 300, 760 320" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="470" y="292" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2dd4bf">SQL writes</text>

  <path d="M 884 440 L 884 500 L 197 500 L 197 600" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="220" y="488" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2dd4bf">Changefeed</text>

  <path d="M 322 655 L 370 655" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M 620 655 L 668 655" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <path d="M 918 655 L 966 655" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <path d="M 1188 600 L 1188 420 L 1108 400" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- Ask path -->
  <path d="M 188 412 C 188 470, 300 470, 420 360" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="250" y="458" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#7dd3fc">ask</text>

  <path d="M 676 300 C 760 300, 880 300, 1008 320" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="820" y="292" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#7dd3fc">vector search</text>

  <rect x="784" y="416" width="424" height="36" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="804" y="439" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">Also: CockroachDB Cloud Managed MCP for exact SQL reads</text>

  <text x="64" y="790" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Hackathon demo: EC2 hosts console + shop + worker. Lambda optional as managed worker. Memory never leaves the customer Cockroach DB.</text>
</svg>
