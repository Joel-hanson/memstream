<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc">
  <title id="title">Memstream in production</title>
  <desc id="desc">Application writes to CockroachDB. Changefeeds go to S3. Lambda embeds with Bedrock and stores vectors in the same database. An agent searches over MCP.</desc>
  <defs>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#0b7285"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#1971c2"/>
    </marker>
    <style>.t{font-family:ui-sans-serif,system-ui,Inter,Helvetica,Arial,sans-serif}</style>
  </defs>

  <rect width="1080" height="640" fill="#fff"/>
  <text class="t" x="60" y="52" font-size="26" font-weight="700" fill="#1e1e1e">Memstream in production</text>
  <text class="t" x="60" y="80" font-size="14" fill="#868e96">Agent + CockroachDB + AWS — live writes become searchable memory</text>

  <rect x="60" y="160" width="200" height="120" rx="12" fill="#fff" stroke="#495057" stroke-width="2"/>
  <text class="t" x="160" y="212" font-size="16" font-weight="600" fill="#1e1e1e" text-anchor="middle">Application</text>
  <text class="t" x="160" y="236" font-size="13" fill="#495057" text-anchor="middle">SQL writes</text>

  <rect x="400" y="140" width="280" height="160" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text class="t" x="540" y="198" font-size="16" font-weight="700" fill="#1e1e1e" text-anchor="middle">CockroachDB Cloud</text>
  <text class="t" x="540" y="224" font-size="13" fill="#1864ab" text-anchor="middle">app tables</text>
  <text class="t" x="540" y="246" font-size="13" fill="#1864ab" text-anchor="middle">+ vector memory</text>

  <rect x="820" y="160" width="200" height="120" rx="12" fill="#96f2d7" stroke="#0b7285" stroke-width="2"/>
  <text class="t" x="920" y="212" font-size="16" font-weight="600" fill="#1e1e1e" text-anchor="middle">Agent</text>
  <text class="t" x="920" y="236" font-size="13" fill="#0b7285" text-anchor="middle">Cursor + MCP</text>

  <rect x="60" y="400" width="960" height="200" rx="12" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
  <text class="t" x="80" y="428" font-size="13" font-weight="700" fill="#d9480f">AWS</text>

  <rect x="120" y="456" width="200" height="100" rx="10" fill="#fff" stroke="#c2255c" stroke-width="2"/>
  <text class="t" x="220" y="500" font-size="15" font-weight="600" fill="#1e1e1e" text-anchor="middle">Amazon S3</text>
  <text class="t" x="220" y="522" font-size="12" fill="#495057" text-anchor="middle">changefeed sink</text>

  <rect x="440" y="456" width="200" height="100" rx="10" fill="#fff" stroke="#d9480f" stroke-width="2"/>
  <text class="t" x="540" y="500" font-size="15" font-weight="600" fill="#1e1e1e" text-anchor="middle">AWS Lambda</text>
  <text class="t" x="540" y="522" font-size="12" fill="#495057" text-anchor="middle">memory worker</text>

  <rect x="760" y="456" width="200" height="100" rx="10" fill="#fff" stroke="#d9480f" stroke-width="2"/>
  <text class="t" x="860" y="500" font-size="15" font-weight="600" fill="#1e1e1e" text-anchor="middle">Amazon Bedrock</text>
  <text class="t" x="860" y="522" font-size="12" fill="#495057" text-anchor="middle">embeddings</text>

  <path d="M260 220 H392" fill="none" stroke="#0b7285" stroke-width="2" marker-end="url(#teal)"/>
  <text class="t" x="326" y="208" font-size="12" font-weight="600" fill="#0b7285" text-anchor="middle">writes</text>

  <path d="M820 220 H688" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#blue)"/>
  <text class="t" x="754" y="208" font-size="12" font-weight="600" fill="#1971c2" text-anchor="middle">search + SQL</text>

  <path d="M480 300 V370 H220 V456" fill="none" stroke="#0b7285" stroke-width="2" marker-end="url(#teal)"/>
  <text class="t" x="300" y="362" font-size="12" font-weight="600" fill="#0b7285">changefeed</text>

  <path d="M320 506 H440" fill="none" stroke="#0b7285" stroke-width="2" marker-end="url(#teal)"/>
  <path d="M640 506 H760" fill="none" stroke="#0b7285" stroke-width="2" marker-end="url(#teal)"/>

  <path d="M860 456 V370 H620 V300" fill="none" stroke="#0b7285" stroke-width="2" marker-end="url(#teal)"/>
  <text class="t" x="740" y="362" font-size="12" font-weight="600" fill="#0b7285">store vectors</text>
</svg>
