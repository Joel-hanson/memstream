# GENERATED by `npm run synth -w @memstream/infra` — do not edit by hand.
# Source of truth: infra/cdk/ (TypeScript CDK). Re-run synth after changing stacks.
Description: Memstream Lambda worker — S3 CDC ObjectCreated → embed → Cockroach memory. Shop/console stay local. Uses an
  existing CDC bucket (notification wired by deploy). DB URLs live in Secrets Manager (ConfigSecretArn), not in CFN
  parameters.
Parameters:
  CdcS3Bucket:
    Type: String
    AllowedPattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
    Description: Existing S3 bucket used for CDC (and the Lambda zip).
  CdcS3Prefix:
    Type: String
    Default: cdc/
    Description: Prefix the changefeed writes under.
  DeployObjectKey:
    Type: String
    Default: deploy/memstream-lambda.zip
    Description: Object key for the Lambda deployment package.
  ConfigSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN for JSON {DATABASE_URL, MEMSTREAM_DATABASE_URL, MEMSTREAM_SECRETS_KEY}.
  DatabaseUrl:
    Type: String
    Default: ""
    Description: DEPRECATED. Use ConfigSecretArn.
    NoEcho: true
  MemstreamDatabaseUrl:
    Type: String
    Default: ""
    Description: DEPRECATED. Use ConfigSecretArn.
    NoEcho: true
  MemstreamConnectionId:
    Type: String
    Default: ""
    Description: Optional connection UUID for CDC cursor scope.
  BedrockEmbedModel:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  MemoryProfile:
    Type: String
    Default: commerce
    Description: Profile id (or legacy path). Loaded from memstream_profiles.
Conditions:
  HasConfigSecret:
    Fn::Not:
      - Fn::Equals:
          - Ref: ConfigSecretArn
          - ""
Resources:
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: ListCdcBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  Fn::Sub:
                    - arn:aws:s3:::${CdcS3Bucket}
                    - CdcS3Bucket:
                        Ref: CdcS3Bucket
              - Sid: ReadCdcAndDeploy
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - Fn::Sub:
                      - arn:aws:s3:::${CdcS3Bucket}/${CdcS3Prefix}*
                      - CdcS3Bucket:
                          Ref: CdcS3Bucket
                        CdcS3Prefix:
                          Ref: CdcS3Prefix
                  - Fn::Sub:
                      - arn:aws:s3:::${CdcS3Bucket}/${DeployObjectKey}
                      - CdcS3Bucket:
                          Ref: CdcS3Bucket
                        DeployObjectKey:
                          Ref: DeployObjectKey
              - Sid: BedrockEmbed
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
              - Sid: ReadDeployConfigSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  Fn::If:
                    - HasConfigSecret
                    - Ref: ConfigSecretArn
                    - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:memstream/*
          PolicyName: memstream-s3-bedrock
  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket:
          Ref: CdcS3Bucket
        S3Key:
          Ref: DeployObjectKey
      Description: Memstream S3 CDC → agent memory
      Environment:
        Variables:
          CONFIG_SECRET_ARN:
            Ref: ConfigSecretArn
          DATABASE_URL:
            Ref: DatabaseUrl
          MEMSTREAM_DATABASE_URL:
            Ref: MemstreamDatabaseUrl
          MEMSTREAM_CONNECTION_ID:
            Ref: MemstreamConnectionId
          CDC_S3_BUCKET:
            Ref: CdcS3Bucket
          CDC_S3_PREFIX:
            Ref: CdcS3Prefix
          BEDROCK_EMBED_MODEL:
            Ref: BedrockEmbedModel
          MEMORY_PROFILE:
            Ref: MemoryProfile
          MEMSTREAM_EMBEDDER: bedrock
          MEMSTREAM_STORE: cockroach
          MEMSTREAM_SOURCE: s3
          PGSSLROOTCERT: /var/task/certs/root.crt
      FunctionName:
        Fn::Sub: ${AWS::StackName}-worker
      Handler: index.handler
      MemorySize: 512
      Role:
        Fn::GetAtt:
          - WorkerRole
          - Arn
      Runtime: nodejs20.x
      Timeout: 60
  S3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: WorkerFunction
      Principal: s3.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::Sub:
          - arn:aws:s3:::${CdcS3Bucket}
          - CdcS3Bucket:
              Ref: CdcS3Bucket
Outputs:
  FunctionName:
    Description: Lambda function name
    Value:
      Ref: WorkerFunction
  FunctionArn:
    Description: Lambda function ARN (for S3 notification)
    Value:
      Fn::GetAtt:
        - WorkerFunction
        - Arn
  RoleArn:
    Description: Worker IAM role
    Value:
      Fn::GetAtt:
        - WorkerRole
        - Arn
