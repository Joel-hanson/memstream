AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Memstream demo box — EC2 (shop + S3 watcher), IAM instance role
  (S3 CDC + deploy package + Bedrock embeddings), security group.
  Cockroach Cloud and changefeed stay outside this stack.

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro, t4g.micro, t4g.small]
    Description: t3/t2 = x86_64; t4g = arm64 (use with linux/arm64 prebuild on Apple Silicon).

  AmiIdX86:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 x86_64 AMI (resolved via SSM).

  AmiIdArm:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 arm64 AMI (resolved via SSM).

  CdcS3Bucket:
    Type: String
    Description: Existing S3 bucket used for CDC (and the deploy tarball).
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"

  CdcS3Prefix:
    Type: String
    Default: cdc/
    Description: Prefix the changefeed writes under.

  DeployObjectKey:
    Type: String
    Default: deploy/memstream-prebuilt.tgz
    Description: Object key for the prebuilt tarball uploaded by scripts/deploy-aws.sh.

  ConfigSecretArn:
    Type: String
    Default: ""
    Description: >
      Secrets Manager ARN for JSON {DATABASE_URL, MEMSTREAM_DATABASE_URL, MEMSTREAM_SECRETS_KEY}.
      Prefer this over legacy plaintext parameters (which should stay empty).

  # Legacy — leave empty. Kept so existing stacks can update; secrets belong in ConfigSecretArn.
  DatabaseUrl:
    Type: String
    NoEcho: true
    Default: ""
    Description: DEPRECATED. Use ConfigSecretArn.

  MemstreamDatabaseUrl:
    Type: String
    NoEcho: true
    Default: ""
    Description: DEPRECATED. Use ConfigSecretArn.

  MemstreamSecretsKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: DEPRECATED. Use ConfigSecretArn.

  MemstreamWorkerCompute:
    Type: String
    Default: ec2
    AllowedValues: [ec2, lambda]
    Description: >-
      Default cloud worker when Enable runs on this host (UI can override).
      lambda deploys an S3-triggered function and stops memstream-watch.

  BedrockEmbedModel:
    Type: String
    Default: amazon.titan-embed-text-v2:0

  MemoryProfile:
    Type: String
    Default: commerce
    Description: Profile id (or legacy path like profiles/commerce.yaml). Content is loaded from memstream_profiles.

  ShopCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >-
      CIDR allowed to reach the console/shop on port 3000.
      Default is open for demos; tighten to YOUR_IP/32 for real use.
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair for SSH. Prefer SSM Session Manager (always enabled).

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  HasConfigSecret: !Not [!Equals [!Ref ConfigSecretArn, ""]]
  UseArmAmi: !Or
    - !Equals [!Ref InstanceType, t4g.micro]
    - !Equals [!Ref InstanceType, t4g.small]

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: memstream-s3-bedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListCdcBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:aws:s3:::${CdcS3Bucket}"
              - Sid: ReadCdcAndDeploy
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${CdcS3Bucket}/${CdcS3Prefix}*"
                  - !Sub "arn:aws:s3:::${CdcS3Bucket}/${DeployObjectKey}"
              # Enable on this box embeds InstanceRole creds into CREATE EXTERNAL
              # CONNECTION; Cockroach Cloud then PutObject's a sentinel + CDC files.
              - Sid: WriteCdcForChangefeed
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "arn:aws:s3:::${CdcS3Bucket}/${CdcS3Prefix}*"
              - Sid: UploadLambdaZip
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${CdcS3Bucket}/deploy/*"
              - Sid: S3BucketNotifications
                Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                Resource: !Sub "arn:aws:s3:::${CdcS3Bucket}"
              - Sid: DeployLambdaStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: ManageLambdaWorker
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:ListVersionsByFunction
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:InvokeFunction
                Resource: "*"
              - Sid: PassAndManageLambdaRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                Resource: "*"
              - Sid: BedrockEmbed
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
              - Sid: ReadDeployConfigSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !If
                  - HasConfigSecret
                  - !Ref ConfigSecretArn
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:memstream/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Memstream console/shop (3000); SSM for shell (no SSH ingress)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref ShopCidr
          Description: Memstream Next.js console + shop
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If [UseArmAmi, !Ref AmiIdArm, !Ref AmiIdX86]
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !Ref SecurityGroup
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-demo"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/memstream-userdata.log) 2>&1

          dnf install -y tar gzip awscli python3
          # AL2023 ships curl-minimal (provides `curl`); do not install curl — it conflicts.
          # AL2023 default nodejs is 18; Memstream / Next 15 need >=20
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs
          node -v
          npm -v

          install -d -m 0755 /opt/memstream
          aws s3 cp "s3://${CdcS3Bucket}/${DeployObjectKey}" /tmp/memstream-prebuilt.tgz
          tar -xzf /tmp/memstream-prebuilt.tgz -C /opt/memstream
          cd /opt/memstream

          if [[ ! -f /opt/memstream/PREBUILT ]]; then
            echo "ERROR: expected prebuilt artifact (PREBUILT marker missing)" >&2
            ls -la /opt/memstream >&2 || true
            exit 1
          fi
          if [[ ! -f /opt/memstream/web/apps/web/server.js ]] && [[ ! -f /opt/memstream/web/server.js ]]; then
            echo "ERROR: Next standalone server.js not found" >&2
            find /opt/memstream/web -name 'server.js' >&2 || true
            exit 1
          fi

          cat > /opt/memstream/.env <<'ENVEOF'
          AWS_REGION=${AWS::Region}
          CDC_S3_BUCKET=${CdcS3Bucket}
          CDC_S3_PREFIX=${CdcS3Prefix}
          BEDROCK_EMBED_MODEL=${BedrockEmbedModel}
          MEMORY_PROFILE=${MemoryProfile}
          MEMSTREAM_EMBEDDER=bedrock
          MEMSTREAM_STORE=cockroach
          MEMSTREAM_SOURCE=s3
          MEMSTREAM_WATCH=true
          MEMSTREAM_POLL_INTERVAL=5
          MEMSTREAM_PREBUILT=1
          MEMSTREAM_ROOT=/opt/memstream
          MEMSTREAM_WORKER_COMPUTE=${MemstreamWorkerCompute}
          SHOP_BACKEND=cockroach
          NODE_ENV=production
          PORT=3000
          HOSTNAME=0.0.0.0
          PGSSLROOTCERT=/opt/memstream/certs/root.crt
          MEMSTREAM_SSLROOTCERT=/opt/memstream/certs/root.crt
          CONFIG_SECRET_ARN=${ConfigSecretArn}
          ENVEOF
          # Secrets from Secrets Manager (preferred) or legacy CFN params (empty in new deploys)
          python3 <<'PY'
          import json, subprocess
          env_path = "/opt/memstream/.env"
          arn = "${ConfigSecretArn}".strip()
          values = {
            "DATABASE_URL": """${DatabaseUrl}""",
            "MEMSTREAM_DATABASE_URL": """${MemstreamDatabaseUrl}""",
            "MEMSTREAM_SECRETS_KEY": """${MemstreamSecretsKey}""",
          }
          if arn:
            try:
              out = subprocess.check_output(
                ["aws", "secretsmanager", "get-secret-value",
                 "--secret-id", arn, "--query", "SecretString", "--output", "text"],
                text=True,
              )
              parsed = json.loads(out)
              for k in ("DATABASE_URL", "MEMSTREAM_DATABASE_URL", "MEMSTREAM_SECRETS_KEY"):
                if parsed.get(k):
                  values[k] = str(parsed[k])
            except Exception as e:
              print(f"WARN: could not load ConfigSecretArn: {e}", flush=True)
          with open(env_path, "a", encoding="utf-8") as f:
            for k, v in values.items():
              if not v:
                continue
              esc = v.replace("\\", "\\\\").replace('"', '\\"').replace("$", "\\$")
              f.write(f'{k}="{esc}"\n')
          PY
          chmod 600 /opt/memstream/.env
          if [[ ! -f /opt/memstream/certs/root.crt ]]; then
            echo "WARN: certs/root.crt missing from package — Cockroach TLS may fail" >&2
          fi

          cat > /usr/local/bin/memstream-shop-run <<'EOF'
          #!/bin/bash
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /opt/memstream/.env
          set +a
          export HOSTNAME=0.0.0.0
          export PORT=3000
          cd /opt/memstream/web
          if [[ -f apps/web/server.js ]]; then
            exec node apps/web/server.js
          fi
          if [[ -f server.js ]]; then
            exec node server.js
          fi
          echo "ERROR: Next standalone server.js not found under /opt/memstream/web" >&2
          exit 1
          EOF
          chmod +x /usr/local/bin/memstream-shop-run

          cat > /usr/local/bin/memstream-watch-run <<'EOF'
          #!/bin/bash
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source /opt/memstream/.env
          set +a
          cd /opt/memstream/worker
          EXTRA=()
          if [[ -n "${!DATABASE_URL:-}" ]]; then
            EXTRA+=(--database-url "$DATABASE_URL")
          fi
          if [[ -n "${!CDC_S3_BUCKET:-}" ]]; then
            EXTRA+=(--s3-bucket "$CDC_S3_BUCKET")
          fi
          if [[ -n "${!CDC_S3_PREFIX:-}" ]]; then
            EXTRA+=(--s3-prefix "$CDC_S3_PREFIX")
          fi
          exec node dist/cli.js \
            --profile "${!MEMORY_PROFILE:-commerce}" \
            --source s3 \
            --embedder bedrock \
            --store cockroach \
            --aws-region "${!AWS_REGION:-us-east-1}" \
            "${!EXTRA[@]}" \
            --watch \
            --poll-interval "${!MEMSTREAM_POLL_INTERVAL:-5}"
          EOF
          chmod +x /usr/local/bin/memstream-watch-run

          cat > /etc/systemd/system/memstream-shop.service <<'EOF'
          [Unit]
          Description=Memstream Next.js console + shop (prebuilt)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/memstream
          ExecStart=/usr/local/bin/memstream-shop-run
          Restart=on-failure
          RestartSec=5
          EnvironmentFile=/opt/memstream/.env

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > /etc/systemd/system/memstream-watch.service <<'EOF'
          [Unit]
          Description=Memstream S3 CDC watcher (prebuilt)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/memstream/worker
          ExecStart=/usr/local/bin/memstream-watch-run
          Restart=on-failure
          RestartSec=5
          EnvironmentFile=/opt/memstream/.env

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now memstream-shop.service
          systemctl enable --now memstream-watch.service

          for i in $(seq 1 36); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/shop; then
              echo "memstream shop healthy on :3000"
              break
            fi
            if [[ "$i" -eq 36 ]]; then
              echo "ERROR: shop did not become healthy; journalctl -u memstream-shop -n 80" >&2
              systemctl status memstream-shop --no-pager -l || true
              journalctl -u memstream-shop -n 80 --no-pager || true
              exit 1
            fi
            sleep 2
          done

          echo "memstream userdata complete"

Outputs:
  InstanceId:
    Description: EC2 instance id
    Value: !Ref DemoInstance

  PublicIp:
    Description: Public IPv4 (changes if you stop/start without an Elastic IP)
    Value: !GetAtt DemoInstance.PublicIp

  PublicDns:
    Description: Public DNS name (resolves to PublicIp; preferred over raw IP)
    Value: !GetAtt DemoInstance.PublicDnsName

  ShopUrl:
    Description: Demo shop + console URL (Next.js; /shop, /connect, /enable, …)
    Value: !Sub "http://${DemoInstance.PublicDnsName}:3000/shop"

  SsmConnectHint:
    Description: Connect without SSH
    Value: !Sub "aws ssm start-session --target ${DemoInstance} --region ${AWS::Region}"
